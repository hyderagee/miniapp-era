  <p>Откройте каталог, чтобы посмотреть предложения</p>

  <a id="catalog" class="btn" href="https://era.trade/partners/#tab-7">Каталог</a>

  <script>
    // #tab-7 — сразу открывает вкладку «Каталоги» (ссылка из меню сайта era.trade)
    const CATALOG_URL = 'https://era.trade/partners/#tab-7';
    const WebApp = window.WebApp;

    // Сообщаем MAX, что мини-приложение готово к показу
    if (WebApp && typeof WebApp.ready === 'function') WebApp.ready();

    // Мини-приложение запущено во фрейме (веб- и десктоп-версия MAX)?
    // era.trade запрещает показ своих страниц внутри чужих фреймов,
    // поэтому там переход внутри окна даёт ошибку «не позволяет установить соединение».
    let inFrame;
    try { inFrame = window.self !== window.top; } catch (_) { inFrame = true; }

    document.getElementById('catalog').addEventListener('click', (e) => {
      e.preventDefault();
      if (!inFrame) {
        // Мобильное приложение MAX: открываем каталог прямо в окне мини-приложения
        window.location.href = CATALOG_URL;
      } else if (WebApp && typeof WebApp.openLink === 'function') {
        // Во фрейме встроить сайт нельзя — открываем через MAX в новой вкладке
        WebApp.openLink(CATALOG_URL);
      } else {
        window.open(CATALOG_URL, '_blank', 'noopener');
      }
    });
  </script>
